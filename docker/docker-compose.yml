services:
  mt5:
    image: gmag11/metatrader5_vnc:1.1
    container_name: robot_mt5
    restart: unless-stopped
    shm_size: "1g"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    ports:
      - "${MT5_VNC_PORT:-8088}:3000"
    environment:
      - CUSTOM_USER=${MT5_VNC_USER:-fendi}
      - PASSWORD=${MT5_VNC_PASSWORD:-fendi123}
    volumes:
      - mt5_data:/config
    networks:
      - robot_net

networks:
  robot_net:
    name: robot_network
    driver: bridge

volumes:
  mt5_data:
    name: robot_mt5_data
