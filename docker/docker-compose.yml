services:
  mt5:
    image: robot-mt5:custom
    container_name: robot_mt5
    restart: unless-stopped
    shm_size: "1g"
    security_opt:
      - seccomp:unconfined
    ports:
      - "${MT5_VNC_PORT:-8088}:3000"
    environment:
      - CUSTOM_USER=${MT5_VNC_USER:-fendi}
      - PASSWORD=${MT5_VNC_PASSWORD:-fendi123}
    volumes:
      - mt5_data:/config
    networks:
      - robot_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: robot_backend
    restart: unless-stopped
    ports:
      - "${BRIDGE_API_PORT:-8089}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_12345}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_this_password}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - MT5_MAGIC_NUMBER=${MT5_MAGIC_NUMBER:-778899}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    networks:
      - robot_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: robot_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - robot_net

networks:
  robot_net:
    name: robot_network
    driver: bridge

volumes:
  mt5_data:
    name: robot_mt5_data
