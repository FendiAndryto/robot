services:
  mt5:
    image: robot-mt5:custom
    container_name: robot_mt5
    restart: unless-stopped
    shm_size: "1g"
    security_opt:
      - seccomp:unconfined
    ports:
      - "${MT5_VNC_PORT:-8088}:3000"
    environment:
      - CUSTOM_USER=${MT5_VNC_USER:-fendi}
      - PASSWORD=${MT5_VNC_PASSWORD:-fendi123}
    volumes:
      - mt5_data:/config
    networks:
      - robot_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: robot_backend
    restart: unless-stopped
    ports:
      - "${BRIDGE_API_PORT:-8089}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_12345}
      - MT5_MAGIC_NUMBER=${MT5_MAGIC_NUMBER:-778899}
      - ALLOWED_HOSTS=*
    networks:
      - robot_net

networks:
  robot_net:
    name: robot_network
    driver: bridge

volumes:
  mt5_data:
    name: robot_mt5_data
