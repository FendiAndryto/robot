services:
  # MT5 service disabled on server: Trading terminal runs natively on local laptop
  # mt5:
  #   image: robot-mt5:custom
  #   container_name: robot_mt5
  #   restart: unless-stopped
  #   shm_size: "1g"
  #   security_opt:
  #     - seccomp:unconfined
  #   ports:
  #     - "${MT5_VNC_PORT:-8088}:3000"
  #   environment:
  #     - CUSTOM_USER=${MT5_VNC_USER:-fendi}
  #     - PASSWORD=${MT5_VNC_PASSWORD:-fendi123}
  #   volumes:
  #     - mt5_data:/config
  #   networks:
  #     - robot_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: robot_backend
    restart: unless-stopped
    ports:
      - "${BRIDGE_API_PORT:-8089}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_12345}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_this_password}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - MT5_MAGIC_NUMBER=${MT5_MAGIC_NUMBER:-778899}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_NOTIFICATIONS_ENABLED=${TELEGRAM_NOTIFICATIONS_ENABLED:-true}
      - MAX_DAILY_DRAWDOWN_PERCENT=${MAX_DAILY_DRAWDOWN_PERCENT:-3.0}
      - DEFAULT_RISK_PER_TRADE_PERCENT=${DEFAULT_RISK_PER_TRADE_PERCENT:-1.0}
      - AUTOPILOT_DEFAULT_ENABLED=${AUTOPILOT_DEFAULT_ENABLED:-false}
    networks:
      - robot_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: robot_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3010}:80"
    depends_on:
      - backend
    networks:
      - robot_net

networks:
  robot_net:
    name: robot_network
    driver: bridge

volumes:
  mt5_data:
    name: robot_mt5_data
